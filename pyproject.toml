[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onefilellm"
version = "0.1.0"
description = "A tool to process various file types and sources into a single file for LLM consumption"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests",
    "beautifulsoup4",
    "PyPDF2",
    "tiktoken",
    "nltk",
    "nbformat",
    "nbconvert",
    "youtube_transcript_api",
    "pyperclip",
    "wget",
    "tqdm",
    "rich"
]

[project.scripts]
onefilellm = "onefilellm.cli:main" 